<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON ARENA FPS</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b15;color:white;font-family:Arial,sans-serif;overflow:hidden}
header{height:54px;display:flex;align-items:center;justify-content:space-around;background:#11182b;font-weight:bold}
header span{color:#42f5cf}
canvas{display:block;width:100%;height:calc(100dvh - 54px);touch-action:none}
#menu{position:absolute;inset:54px 0 0;background:#080b15dd;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
.panel{max-width:430px;background:#141c31;border:1px solid #42f5cf;border-radius:18px;padding:25px}
h1{color:#42f5cf}
button{border:0;border-radius:10px;background:#42f5cf;color:#071019;padding:13px 18px;font-weight:bold;font-size:16px;cursor:pointer;touch-action:manipulation}
#touch{position:absolute;bottom:22px;left:0;right:0;display:none;justify-content:space-between;padding:0 15px;pointer-events:none}
.pad{display:grid;grid-template-columns:repeat(2,60px);gap:8px}
.pad button,#fire{pointer-events:auto;background:#182944;color:white;border:1px solid #42f5cf;min-height:54px}
#fire{background:#a52d5a}
@media(pointer:coarse){#touch{display:flex}}
</style>
</head>
<body>
<header>
<div>⚡ NEON ARENA</div>
<div>Score : <span id="score">0</span></div>
<div>❤️ <span id="hp">100</span></div>
</header>

<canvas id="game"></canvas>

<div id="menu">
<div class="panel">
<h1>NEON ARENA</h1>
<p>Bienvenue dans l'arène !</p>
<p>Explore le labyrinthe 3D, repère les drones et touche-les avec ton pulse énergétique.</p>
<p>PC : ZQSD / WASD pour bouger, souris pour regarder, clic pour tirer.</p>
<p>Mobile : utilise les boutons et le bouton PULSE.</p>
<button id="start">JOUER ▶</button>
</div>
</div>

<div id="touch">
<div class="pad">
<button data-key="left">↶</button>
<button data-key="right">↷</button>
<button data-key="forward">⬆️</button>
<button data-key="back">⬇️</button>
</div>
<button id="fire">⚡ PULSE</button>
</div>

<script>
const canvas=document.querySelector("#game");
const ctx=canvas.getContext("2d");
const menu=document.querySelector("#menu");
const scoreUI=document.querySelector("#score");
const hpUI=document.querySelector("#hp");

let W=640,H=400;
let running=false,score=0,hp=100;
let px=2.5,py=2.5,angle=0;
let keys={};
let last=0,flash=0,hitFlash=0;
let drones=[],depths=[];
const FOV=Math.PI/2.8;

const map=[
"111111111111",
"100000000001",
"101100110101",
"100000000001",
"101011010101",
"100000000001",
"101100110101",
"100000000001",
"111111111111"
];

function resize(){
 const r=canvas.getBoundingClientRect();
  W=canvas.width=Math.max(320,Math.floor(r.width));
   H=canvas.height=Math.max(240,Math.floor(r.height));
   }
   window.addEventListener("resize",resize);
   resize();

   function wall(x,y){
    const mx=Math.floor(x),my=Math.floor(y);
     return !map[my]||map[my][mx]!=="0";
     }

     function newDrone(){
      for(let i=0;i<100;i++){
        const x=1.5+Math.random()*9;
          const y=1.5+Math.random()*6;
            if(!wall(x,y)&&Math.hypot(x-px,y-py)>3){
               drones.push({x,y,phase:Math.random()*6,alive:true});
                  return;
                    }
                     }
                     }

                     function reset(){
                      px=2.5;py=1.5;angle=0;
                       score=0;hp=100;flash=0;hitFlash=0;
                        drones=[];
                         for(let i=0;i<6;i++)newDrone();
                          scoreUI.textContent=score;
                           hpUI.textContent=hp;
                            running=true;
                             menu.style.display="none";
                              last=performance.now();
                               requestAnimationFrame(loop);
                               }

                               function cast(a){
                                const dx=Math.cos(a),dy=Math.sin(a);
                                 for(let d=.03;d<18;d+=.025){
                                   if(wall(px+dx*d,py+dy*d))return d;
                                    }
                                     return 18;
                                     }

                                     function drawWorld(){
                                      const sky=ctx.createLinearGradient(0,0,0,H/2);
                                       sky.addColorStop(0,"#10142e");
                                        sky.addColorStop(1,"#293450");
                                         ctx.fillStyle=sky;
                                          ctx.fillRect(0,0,W,H/2);

                                           const floor=ctx.createLinearGradient(0,H/2,0,H);
                                            floor.addColorStop(0,"#202c43");
                                             floor.addColorStop(1,"#080b15");
                                              ctx.fillStyle=floor;
                                               ctx.fillRect(0,H/2,W,H/2);

                                                depths=[];
                                                 const rays=Math.ceil(W/3);
                                                  for(let i=0;i<rays;i++){
                                                    const a=angle+(i/rays-.5)*FOV;
                                                      const d=cast(a);
                                                        depths[i]=d*Math.cos(a-angle);
                                                          const height=Math.min(H*2,H/(depths[i]*.85));
                                                            const shade=Math.max(18,100-depths[i]*9);
                                                              ctx.fillStyle=`rgb(${shade*.32},${shade*.65},${shade})`;
                                                                const x=i*W/rays;
                                                                  ctx.fillRect(x,(H-height)/2,W/rays+1,height);
                                                                    ctx.fillStyle="rgba(66,245,207,.12)";
                                                                      ctx.fillRect(x,(H-height)/2,W/rays+1,2);
                                                                       }
                                                                       }

                                                                       function drawDrones(){
                                                                        const visible=drones.filter(d=>d.alive).map(d=>{
                                                                          const dx=d.x-px,dy=d.y-py;
                                                                            let rel=Math.atan2(dy,dx)-angle;
                                                                              while(rel>Math.PI)rel-=Math.PI*2;
                                                                                while(rel< -Math.PI)rel+=Math.PI*2;
                                                                                  return {d,dist:Math.hypot(dx,dy),rel};
                                                                                   }).filter(o=>Math.abs(o.rel)<FOV*.7&&o.dist>.15)
                                                                                    .sort((a,b)=>b.dist-a.dist);

                                                                                     for(const o of visible){
                                                                                       const screenX=W/2+Math.tan(o.rel)/(Math.tan(FOV/2))*W/2;
                                                                                         const size=Math.min(H*.65,H/(o.dist*.9));
                                                                                           const screenY=H/2+Math.sin(o.d.phase)*size*.06;
                                                                                             const ray=Math.floor(screenX/W*depths.length);
                                                                                               if(ray<0||ray>=depths.length||depths[ray]<o.dist-.2)continue;

                                                                                                 ctx.save();
                                                                                                   ctx.translate(screenX,screenY);
                                                                                                     ctx.fillStyle="#ff477e";
                                                                                                       ctx.shadowColor="#ff477e";
                                                                                                         ctx.shadowBlur=15;
                                                                                                           ctx.beginPath();
                                                                                                             ctx.arc(0,0,size*.24,0,Math.PI*2);
                                                                                                               ctx.fill();
                                                                                                                 ctx.shadowBlur=0;
                                                                                                                   ctx.fillStyle="#291027";
                                                                                                                     ctx.fillRect(-size*.15,-size*.055,size*.3,size*.11);
                                                                                                                       ctx.fillStyle="#ffffff";
                                                                                                                         ctx.fillRect(-size*.1,-size*.035,size*.06,size*.035);
                                                                                                                           ctx.fillRect(size*.04,-size*.035,size*.06,size*.035);
                                                                                                                             ctx.strokeStyle="#ff8cb1";
                                                                                                                               ctx.lineWidth=Math.max(2,size*.035);
                                                                                                                                 ctx.beginPath();
                                                                                                                                   ctx.moveTo(-size*.3,size*.2);
                                                                                                                                     ctx.lineTo(-size*.45,size*.35);
                                                                                                                                       ctx.moveTo(size*.3,size*.2);
                                                                                                                                         ctx.lineTo(size*.45,size*.35);
                                                                                                                                           ctx.stroke();
                                                                                                                                             ctx.restore();
                                                                                                                                              }
                                                                                                                                              }

                                                                                                                                              function drawHUD(){
                                                                                                                                               const cx=W/2,cy=H/2;
                                                                                                                                                ctx.strokeStyle=flash>0?"#ffcf45":"#42f5cf";
                                                                                                                                                 ctx.lineWidth=2;
                                                                                                                                                  ctx.beginPath();
                                                                                                                                                   ctx.moveTo(cx-10,cy);ctx.lineTo(cx-3,cy);
                                                                                                                                                    ctx.moveTo(cx+3,cy);ctx.lineTo(cx+10,cy);
                                                                                                                                                     ctx.moveTo(cx,cy-10);ctx.lineTo(cx,cy-3);
                                                                                                                                                      ctx.moveTo(cx,cy+3);ctx.lineTo(cx,cy+10);
                                                                                                                                                       ctx.stroke();

                                                                                                                                                        if(flash>0){
                                                                                                                                                          ctx.strokeStyle="#ffcf45";
                                                                                                                                                            ctx.lineWidth=4;
                                                                                                                                                              ctx.beginPath();
                                                                                                                                                                ctx.arc(cx,cy,30+Math.random()*8,0,Math.PI*2);
                                                                                                                                                                  ctx.stroke();
                                                                                                                                                                   }
                                                                                                                                                                    if(hitFlash>0){
                                                                                                                                                                      ctx.fillStyle=`rgba(255,50,90,${hitFlash*.25})`;
                                                                                                                                                                        ctx.fillRect(0,0,W,H);
                                                                                                                                                                         }
                                                                                                                                                                         }

                                                                                                                                                                         function move(dt){
                                                                                                                                                                          let forward=0,side=0,turn=0;
                                                                                                                                                                           if(keys.forward||keys.w||keys.z)forward++;
                                                                                                                                                                            if(keys.back||keys.s)forward--;
                                                                                                                                                                             if(keys.left)turn--;
                                                                                                                                                                              if(keys.right)turn++;
                                                                                                                                                                               if(keys.a)side--;
                                                                                                                                                                                if(keys.d)side++;

                                                                                                                                                                                 angle+=turn*2.3*dt;
                                                                                                                                                                                  const speed=2.6*dt;
                                                                                                                                                                                   const dx=Math.cos(angle)*forward*speed-Math.sin(angle)*side*speed;
                                                                                                                                                                                    const dy=Math.sin(angle)*forward*speed+Math.cos(angle)*side*speed;

                                                                                                                                                                                     if(!wall(px+dx,py))px+=dx;
                                                                                                                                                                                      if(!wall(px,py+dy))py+=dy;

                                                                                                                                                                                       for(const d of drones){
                                                                                                                                                                                         if(!d.alive)continue;
                                                                                                                                                                                           d.phase+=dt*3;
                                                                                                                                                                                             const dist=Math.hypot(d.x-px,d.y-py);
                                                                                                                                                                                               if(dist<.7){
                                                                                                                                                                                                  hp=Math.max(0,hp-15);
                                                                                                                                                                                                     hpUI.textContent=hp;
                                                                                                                                                                                                        d.x=9.5;d.y=6.5;
                                                                                                                                                                                                           hitFlash=.4;
                                                                                                                                                                                                              if(hp<=0)endGame();
                                                                                                                                                                                                                }
                                                                                                                                                                                                                 }
                                                                                                                                                                                                                 }

                                                                                                                                                                                                                 function shoot(){
                                                                                                                                                                                                                  if(!running)return;
                                                                                                                                                                                                                   flash=.12;
                                                                                                                                                                                                                    let target=null,best=.12;
                                                                                                                                                                                                                     for(const d of drones){
                                                                                                                                                                                                                       if(!d.alive)continue;
                                                                                                                                                                                                                         const dx=d.x-px,dy=d.y-py;
                                                                                                                                                                                                                           const dist=Math.hypot(dx,dy);
                                                                                                                                                                                                                             let rel=Math.atan2(dy,dx)-angle;
                                                                                                                                                                                                                               while(rel>Math.PI)rel-=Math.PI*2;
                                                                                                                                                                                                                                 while(rel< -Math.PI)rel+=Math.PI*2;
                                                                                                                                                                                                                                   if(Math.abs(rel)<best&&dist<cast(angle+rel)+.15){
                                                                                                                                                                                                                                      best=Math.abs(rel);target=d;
                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                         }
                                                                                                                                                                                                                                          if(target){
                                                                                                                                                                                                                                            target.alive=false;
                                                                                                                                                                                                                                              score+=10;
                                                                                                                                                                                                                                                scoreUI.textContent=score;
                                                                                                                                                                                                                                                  newDrone();
                                                                                                                                                                                                                                                   }
                                                                                                                                                                                                                                                   }

                                                                                                                                                                                                                                                   function endGame(){
                                                                                                                                                                                                                                                    running=false;
                                                                                                                                                                                                                                                     if(document.pointerLockElement===canvas)document.exitPointerLock();
                                                                                                                                                                                                                                                      menu.style.display="flex";
                                                                                                                                                                                                                                                       menu.querySelector("h1").textContent="FIN DE PARTIE";
                                                                                                                                                                                                                                                        menu.querySelector("p").textContent="Score : "+score+" points !";
                                                                                                                                                                                                                                                         menu.querySelectorAll("p")[1].textContent="Tu peux recommencer pour battre ton record.";
                                                                                                                                                                                                                                                          document.querySelector("#start").textContent="REJOUER ↻";
                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                          function loop(t){
                                                                                                                                                                                                                                                           if(!running)return;
                                                                                                                                                                                                                                                            const dt=Math.min((t-last)/1000,.04);
                                                                                                                                                                                                                                                             last=t;
                                                                                                                                                                                                                                                              move(dt);
                                                                                                                                                                                                                                                               flash=Math.max(0,flash-dt);
                                                                                                                                                                                                                                                                hitFlash=Math.max(0,hitFlash-dt);
                                                                                                                                                                                                                                                                 drawWorld();
                                                                                                                                                                                                                                                                  drawDrones();
                                                                                                                                                                                                                                                                   drawHUD();
                                                                                                                                                                                                                                                                    requestAnimationFrame(loop);
                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                    document.querySelector("#start").addEventListener("click",reset);
                                                                                                                                                                                                                                                                    canvas.addEventListener("click",()=>{
                                                                                                                                                                                                                                                                     if(running&&matchMedia("(pointer:fine)").matches){
                                                                                                                                                                                                                                                                       canvas.requestPointerLock?.();
                                                                                                                                                                                                                                                                         shoot();
                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                          });
                                                                                                                                                                                                                                                                          document.addEventListener("mousemove",e=>{
                                                                                                                                                                                                                                                                           if(running&&document.pointerLockElement===canvas)angle+=e.movementX*.0025;
                                                                                                                                                                                                                                                                           });
                                                                                                                                                                                                                                                                           document.addEventListener("keydown",e=>{
                                                                                                                                                                                                                                                                            const k=e.key.toLowerCase();
                                                                                                                                                                                                                                                                             if(["w","a","s","d","z","q","arrowup","arrowdown","arrowleft","arrowright"," "].includes(k))e.preventDefault();
                                                                                                                                                                                                                                                                              if(k==="arrowleft")keys.left=true;
                                                                                                                                                                                                                                                                               if(k==="arrowright")keys.right=true;
                                                                                                                                                                                                                                                                                if(k==="arrowup")keys.forward=true;
                                                                                                                                                                                                                                                                                 if(k==="arrowdown")keys.back=true;
                                                                                                                                                                                                                                                                                  keys[k==="q"?"a":k===" ":"fire"]=true;
                                                                                                                                                                                                                                                                                   if(k===" "&&running)shoot();
                                                                                                                                                                                                                                                                                   });
                                                                                                                                                                                                                                                                                   document.addEventListener("keyup",e=>{
                                                                                                                                                                                                                                                                                    const k=e.key.toLowerCase();
                                                                                                                                                                                                                                                                                     if(k==="arrowleft")keys.left=false;
                                                                                                                                                                                                                                                                                      if(k==="arrowright")keys.right=false;
                                                                                                                                                                                                                                                                                       if(k==="arrowup")keys.forward=false;
                                                                                                                                                                                                                                                                                        if(k==="arrowdown")keys.back=false;
                                                                                                                                                                                                                                                                                         keys[k==="q"?"a":k===" "?"fire":k]=false;
                                                                                                                                                                                                                                                                                         });
                                                                                                                                                                                                                                                                                         document.querySelectorAll("[data-key]").forEach(b=>{
                                                                                                                                                                                                                                                                                          const k=b.dataset.key;
                                                                                                                                                                                                                                                                                           const down=e=>{e.preventDefault();keys[k]=true};
                                                                                                                                                                                                                                                                                            const up=e=>{e.preventDefault();keys[k]=false};
                                                                                                                                                                                                                                                                                             b.addEventListener("pointerdown",down);
                                                                                                                                                                                                                                                                                              b.addEventListener("pointerup",up);
                                                                                                                                                                                                                                                                                               b.addEventListener("pointercancel",up);
                                                                                                                                                                                                                                                                                                b.addEventListener("lostpointercapture",up);
                                                                                                                                                                                                                                                                                                });
                                                                                                                                                                                                                                                                                                document.querySelector("#fire").addEventListener("pointerdown",e=>{
                                                                                                                                                                                                                                                                                                 e.preventDefault();shoot();
                                                                                                                                                                                                                                                                                                 });
                                                                                                                                                                                                                                                                                                 drawWorld();
                                                                                                                                                                                                                                                                                                 drawHUD();
                                                                                                                                                                                                                                                                                                 </script>
                                                                                                                                                                                                                                                                                                 </body>
                                                                                                                                                                                                                                                                                                 </html>
